<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Controle de Refeições</title>
    <!-- Adicione o link para o seu arquivo CSS aqui -->
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #2d2d2d; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .input-dark { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 4px; background-color: #1a1a1a; color: #fff; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-login:hover { background-color: #45a049; }
        .error-message { color: #ff6b6b; font-size: 14px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Controle de Refeições</h2>

        {% if form.errors %}
            <div class="error-message">Usuário ou senha incorretos. Tente novamente.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" class="input-dark" id="id_username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" class="input-dark" id="id_password" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>

            <!-- Vamos adicionar o link de esqueci a senha no próximo passo! -->
        </form>
    </div>

</body>
</html>
